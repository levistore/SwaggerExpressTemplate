<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Playground — Lcode Api</title>
<meta name="description" content="Console API interaktif: jelajahi katalog endpoint, isi parameter, kirim request nyata, dan lihat respons live.">
<link rel="icon" type="image/png" href="/maskot.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<nav class="subnav" id="subnav" data-active="playground"></nav>

<main>
  <!-- ============ KATALOG ============ -->
  <div id="catalogView" style="flex:1">
    <div class="wrap page-pad" style="max-width:64rem">
      <div class="stack-6">
        <div class="page-head">
          <div class="page-head__title">
            <img class="page-head__logo" src="/maskot.png" alt="Lcode Api">
            <div>
              <h1>API Console</h1>
              <p>Direct Endpoint Execution Environment — jelajahi, konfigurasikan, dan eksekusi endpoint live.</p>
            </div>
          </div>
        </div>

        <div class="filters">
          <div class="filters__methods" id="methodFilter" aria-label="Filter method"></div>
          <div class="filters__cat">
            <span class="text-xs-mono text-faint" style="text-transform:uppercase;font-weight:600">Category:</span>
            <select class="filters__select" id="categoryFilter" aria-label="Filter kategori"></select>
          </div>
        </div>

        <div class="stack-6" style="gap:1rem" id="catalogList"></div>

        <p class="text-xs-mono text-faint" id="catalogTotal" style="margin:0"></p>
      </div>
    </div>
  </div>

  <!-- ============ DETAIL ENDPOINT ============ -->
  <div id="detailView" hidden style="flex:1">
    <div class="wrap page-pad" style="max-width:64rem">
      <div class="stack-6">
        <div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--line)">
          <button class="detail-back" id="btnBack">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to Endpoints Catalog
          </button>
        </div>

        <div class="detail-head">
          <div class="detail-head__row">
            <span class="method-chip" id="dMethod"></span>
            <span class="detail-head__path mono" id="dPath"></span>
            <span class="chip chip--outline" id="dAuth"></span>
          </div>
          <div>
            <h1 id="dName"></h1>
            <p id="dDesc"></p>
          </div>
        </div>

        <div class="detail-grid">
          <!-- form kiri -->
          <div>
            <div class="form-card">
              <form id="reqForm" autocomplete="off">
                <div class="auth-note" id="authNote"></div>
                <div id="fieldsWrap"></div>
                <div style="padding-top:0.75rem;border-top:1px solid var(--line-soft)">
                  <button class="btn btn--primary btn--block" style="padding:0.5rem 0.875rem;font-size:0.875rem" type="submit" id="btnExec">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5" style="fill:currentColor" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
                    Execute Request
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- preview + respons kanan -->
          <div class="stack-6" style="gap:1.5rem">
            <div class="request-preview">
              <div class="request-preview__head">
                <span class="request-preview__label">Request Preview</span>
                <div class="request-preview__actions">
                  <button type="button" class="request-preview__copy" id="btnCopy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    Copy cURL
                  </button>
                </div>
              </div>
              <div class="request-preview__line">
                <span class="request-preview__method" id="pvMethod"></span>
                <span class="request-preview__url" id="pvUrl"></span>
              </div>
            </div>

            <div class="stack-6" style="gap:0.75rem">
              <div class="resp-head"><h3>API Response</h3><span class="text-xs-mono text-faint" id="respTime"></span></div>
              <div class="resp-empty" id="respEmpty">
                <div style="max-width:20rem;margin:0 auto">
                  <p>Belum ada request yang dikirim</p>
                  <p>Isi form di samping lalu klik "Execute Request" untuk melihat respons API langsung.</p>
                </div>
              </div>
              <div class="resp-box" id="respBox" hidden>
                <div class="resp-box__bar">
                  <span class="resp-box__status" id="respStatus"></span>
                  <span class="text-faint mono" id="respMeta"></span>
                </div>
                <div class="resp-media" id="respMedia" hidden></div>
                <pre class="resp-box__body" id="respBody"></pre>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<script src="/shell.js"></script>
<script src="/explore.js"></script>
</body>
</html>
